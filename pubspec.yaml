name: calculator_vault
description: A premium calculator with a hidden, fully encrypted personal vault.
publish_to: 'none'
# versionName+versionCode. versionCode must strictly increase with every
# Play upload, forever. Convention: bump patch for fixes, minor for
# features, and +N on every store upload.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local database (community-maintained Hive fork, drop-in compatible)
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # Security
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  local_auth: ^2.3.0

  # Permissions & media (used from Phase 6 onward)
  permission_handler: ^11.3.1
  photo_manager: ^3.6.3
  image_picker: ^1.1.2
  video_player: ^2.9.2
  # Document import. Its Android module needs compileSdk 36 alignment —
  # handled by the subprojects block in android/build.gradle.kts.
  file_picker: ^11.0.2
  # In-app PDF rendering (pdfium). Loads directly from decrypted bytes in
  # memory — no plaintext temp file ever touches disk for viewing.
  pdfrx: ^2.1.0

  # Image decoding / thumbnail generation
  image: ^4.3.0

  # Animations
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  lottie: ^3.2.0

  # Design
  # NOTE: google_fonts was removed on purpose. The app has no INTERNET
  # permission (fully offline vault), so runtime font fetching would fail
  # silently in release builds. Manrope + Inter are bundled below.
  material_symbols_icons: ^4.2801.1
  dynamic_color: ^1.7.0

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  share_plus: ^10.1.3
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
